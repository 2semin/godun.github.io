<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>고던의 비둘기 야바위</title>
    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
            background-image: url('bg.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #090f1d;
            color: #ffffff;
            user-select: none;
        }

        .overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(
                to right,
                rgba(11, 18, 32, 0.15) 0%,
                rgba(15, 23, 42, 0.55) 45%,
                rgba(9, 15, 29, 0.88) 80%,
                rgba(2, 6, 12, 0.96) 100%
            );
            z-index: 1;
            pointer-events: none;
            transition: background 0.6s ease;
        }

        body.game-active .overlay {
            background: radial-gradient(circle at center, rgba(15, 23, 42, 0.72) 0%, rgba(2, 6, 12, 0.94) 100%);
        }

        .bg-sparkles {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 2;
            background-image: 
                radial-gradient(1.5px 1.5px at 20% 30%, rgba(103, 232, 249, 0.4), transparent),
                radial-gradient(2px 2px at 75% 25%, rgba(255, 255, 255, 0.5), transparent),
                radial-gradient(2.5px 2.5px at 85% 65%, rgba(34, 211, 238, 0.6), transparent),
                radial-gradient(1.5px 1.5px at 50% 80%, rgba(165, 243, 252, 0.3), transparent);
            background-size: 500px 500px;
            animation: twinkle 6s ease-in-out infinite alternate;
        }

        @keyframes twinkle {
            0% { opacity: 0.4; }
            100% { opacity: 0.9; transform: scale(1.02); }
        }

        /* ================= 1. 타이틀 화면 ================= */
        .main-content {
            position: absolute;
            top: 50%;
            right: 12%;
            transform: translateY(-50%);
            z-index: 3;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 480px;
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        .main-content.hidden {
            opacity: 0;
            pointer-events: none;
            transform: translateY(-50%) scale(0.95);
        }

        .sub-top {
            font-size: 0.9rem;
            color: #a5f3fc;
            letter-spacing: 4px;
            margin-bottom: 0.8rem;
            font-weight: 700;
            text-shadow: 0 0 10px rgba(34, 211, 238, 0.6), 0 2px 5px rgba(0, 0, 0, 0.8);
        }

        .title {
            font-family: 'Jua', sans-serif;
            font-size: 3.2rem;
            letter-spacing: 2px;
            color: #ffffff;
            margin-bottom: 0.9rem;
            line-height: 1.25;
            text-shadow: 
                0 0 12px rgba(34, 211, 238, 0.7),
                0 0 25px rgba(6, 182, 212, 0.4),
                2px 4px 10px rgba(0, 0, 0, 0.9);
        }

        .sub-bottom {
            font-size: 1rem;
            font-weight: 300;
            color: #cbd5e1;
            margin-bottom: 2.2rem;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.9);
        }

        .btn-primary {
            font-family: 'Jua', sans-serif;
            font-size: 1.35rem;
            color: #ffffff;
            background: linear-gradient(135deg, #06b6d4 0%, #0891b2 50%, #0369a1 100%);
            border: 2px solid rgba(165, 243, 252, 0.6);
            padding: 14px 50px;
            border-radius: 999px;
            cursor: pointer;
            box-shadow: 
                0 0 20px rgba(34, 211, 238, 0.4),
                0 4px 15px rgba(0, 0, 0, 0.6),
                inset 0 1px 2px rgba(255, 255, 255, 0.4);
            transition: all 0.25s ease;
        }

        .btn-primary:hover {
            transform: translateY(-3px) scale(1.05);
            background: linear-gradient(135deg, #22d3ee 0%, #0ea5e9 100%);
            border-color: #ffffff;
            box-shadow: 0 0 30px rgba(34, 211, 238, 0.8), 0 6px 20px rgba(0, 0, 0, 0.5);
        }

        .btn-primary:active {
            transform: translateY(1px) scale(0.98);
        }

        /* ================= 2. 야바위 게임 화면 ================= */
        .game-screen {
            position: absolute;
            inset: 0;
            z-index: 4;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        .game-screen.active {
            opacity: 1;
            pointer-events: auto;
        }

        .top-hud {
            display: flex;
            align-items: center;
            gap: 18px;
            margin-bottom: 0.7rem;
        }

        .stage-badge {
            font-family: 'Jua', sans-serif;
            font-size: 1.05rem;
            color: #67e8f9;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(34, 211, 238, 0.8);
        }

        .stage-badge.hell-mode {
            color: #fbbf24;
            text-shadow: 0 0 12px rgba(245, 158, 11, 0.9);
        }

        .lives-box {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid rgba(244, 63, 94, 0.45);
            padding: 5px 14px;
            border-radius: 999px;
            font-size: 1.15rem;
            box-shadow: 0 0 15px rgba(244, 63, 94, 0.25);
        }

        .heart {
            transition: all 0.3s ease;
            display: inline-block;
        }

        .heart.lost {
            opacity: 0.22;
            filter: grayscale(100%);
            transform: scale(0.85);
        }

        .status-text {
            font-family: 'Jua', sans-serif;
            font-size: 2.1rem;
            color: #ffffff;
            text-align: center;
            margin-bottom: 1.3rem;
            padding: 10px 30px;
            border-radius: 999px;
            background: rgba(8, 51, 68, 0.65);
            border: 1px solid rgba(103, 232, 249, 0.4);
            box-shadow: 0 0 25px rgba(34, 211, 238, 0.25);
            text-shadow: 0 0 12px rgba(34, 211, 238, 0.8), 0 2px 6px rgba(0, 0, 0, 0.9);
            transition: all 0.3s ease;
        }

        .stage {
            position: relative;
            width: 960px;
            max-width: 96vw;
            height: 430px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .cup-slot {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 150px;
            height: 190px;
            margin-left: -75px;
            margin-top: -95px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            cursor: default;
            transition: transform 0.34s cubic-bezier(0.34, 1.35, 0.64, 1);
        }

        .stage.fast-mode .cup-slot {
            transition: transform 0.11s linear;
        }

        .cup-slot.clickable {
            cursor: pointer;
        }

        .cup-slot.clickable:hover .magic-hat {
            filter: drop-shadow(0 0 22px rgba(34, 211, 238, 0.95));
            transform: translateY(-6px);
        }

        .pigeon-box {
            position: absolute;
            bottom: 8px;
            width: 130px;
            height: 130px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1;
            opacity: 0;
            transform: scale(0.8);
            transition: opacity 0.25s ease, transform 0.3s ease;
            filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.8));
        }

        .pigeon-box.visible {
            opacity: 1;
            transform: scale(1);
        }

        .pigeon-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
            border-radius: 50%;
        }

        /* 마술 모자 */
        .magic-hat {
            position: relative;
            z-index: 2;
            width: 130px;
            height: 115px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            transform: translateY(-105px);
            transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1), filter 0.25s ease;
        }

        .cup-slot.covered .magic-hat {
            transform: translateY(0px);
        }

        .stage.compact .pigeon-box {
            width: 108px;
            height: 108px;
        }

        .stage.compact .magic-hat {
            transform: translateY(-92px) scale(0.84);
        }

        .stage.compact .cup-slot.covered .magic-hat {
            transform: translateY(0px) scale(0.84);
        }

        .stage.compact .cup-slot.clickable:hover .magic-hat {
            transform: translateY(-6px) scale(0.84);
        }

        .hat-crown {
            width: 90px;
            height: 90px;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 65%, #020617 100%);
            border: 2px solid #38bdf8;
            border-bottom: none;
            border-radius: 14px 14px 0 0;
            position: relative;
            box-shadow: inset 0 6px 12px rgba(103, 232, 249, 0.25);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .hat-ribbon {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 20px;
            background: linear-gradient(90deg, #06b6d4, #67e8f9, #06b6d4);
            border-top: 1px solid #ffffff;
        }

        .hat-emblem {
            font-size: 1.45rem;
            color: #67e8f9;
            text-shadow: 0 0 8px rgba(34, 211, 238, 0.9);
            margin-bottom: 12px;
        }

        .hat-brim {
            width: 132px;
            height: 20px;
            background: linear-gradient(180deg, #334155 0%, #0f172a 100%);
            border: 2px solid #38bdf8;
            border-radius: 50px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.85);
        }

        .action-area {
            margin-top: 1.2rem;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .next-btn {
            display: none;
            animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .next-btn.show {
            display: inline-block;
        }

        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.7) translateY(10px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* ================= 3. 실패 시 경고 오버레이 모달 ================= */
        .fail-modal {
            position: fixed;
            inset: 0;
            z-index: 20;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(6px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }

        .fail-modal.show {
            opacity: 1;
            pointer-events: auto;
        }

        .fail-img {
            max-height: 52vh;
            max-width: 85vw;
            border-radius: 16px;
            border: 3px solid #f59e0b;
            box-shadow: 0 0 35px rgba(245, 158, 11, 0.65), 0 15px 35px rgba(0, 0, 0, 0.9);
            margin-bottom: 1.4rem;
            animation: impactShake 0.45s cubic-bezier(0.36, 0.07, 0.19, 0.97);
        }

        .fail-modal.meteor-mode .fail-img {
            border-color: #38bdf8;
            box-shadow: 0 0 40px rgba(56, 189, 248, 0.85), 0 15px 35px rgba(0, 0, 0, 0.95);
        }

        .fail-modal.game-over .fail-img {
            border-color: #ef4444;
            box-shadow: 0 0 45px rgba(239, 68, 68, 0.85), 0 15px 35px rgba(0, 0, 0, 0.95);
        }

        @keyframes impactShake {
            0%, 100% { transform: scale(1) rotate(0deg); }
            20% { transform: scale(1.08) rotate(-2deg); }
            40% { transform: scale(1.08) rotate(2deg); }
            60% { transform: scale(1.04) rotate(-1deg); }
            80% { transform: scale(1.02) rotate(1deg); }
        }

        .fail-ment {
            font-family: 'Jua', sans-serif;
            font-size: 2.5rem;
            color: #fbbf24;
            text-align: center;
            text-shadow: 0 0 15px rgba(245, 158, 11, 0.8), 2px 4px 8px rgba(0, 0, 0, 0.95);
            margin-bottom: 0.9rem;
        }

        .fail-modal.meteor-mode .fail-ment {
            color: #7dd3fc;
            text-shadow: 0 0 18px rgba(56, 189, 248, 0.9), 2px 4px 8px rgba(0, 0, 0, 0.95);
        }

        .fail-modal.game-over .fail-ment {
            color: #f87171;
            text-shadow: 0 0 18px rgba(239, 68, 68, 0.9), 2px 4px 8px rgba(0, 0, 0, 0.95);
        }

        .fail-timer {
            font-size: 1.15rem;
            color: #e2e8f0;
            background: rgba(255, 255, 255, 0.1);
            padding: 6px 20px;
            border-radius: 999px;
            border: 1px solid rgba(251, 191, 36, 0.4);
        }

        .restart-home-btn {
            display: none;
            margin-top: 0.6rem;
            font-family: 'Jua', sans-serif;
            font-size: 1.35rem;
            color: #ffffff;
            background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%);
            border: 2px solid #fca5a5;
            padding: 14px 44px;
            border-radius: 999px;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(239, 68, 68, 0.65), 0 6px 18px rgba(0, 0, 0, 0.8);
            transition: all 0.25s ease;
            animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .restart-home-btn:hover {
            transform: translateY(-3px) scale(1.05);
            background: linear-gradient(135deg, #f87171 0%, #dc2626 100%);
            border-color: #ffffff;
            box-shadow: 0 0 35px rgba(239, 68, 68, 0.9);
        }

        .restart-home-btn.show {
            display: inline-block;
        }

        /* ================= 4. 전체 클리어 (이터니티) 축하 모달 ================= */
        .clear-modal {
            position: fixed;
            inset: 0;
            z-index: 25;
            background: radial-gradient(circle at center, rgba(45, 10, 35, 0.92) 0%, rgba(5, 8, 18, 0.97) 100%);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .clear-modal.show {
            opacity: 1;
            pointer-events: auto;
        }

        .eternity-img {
            max-height: 46vh;
            width: auto;
            object-fit: contain;
            margin-bottom: 1.5rem;
            filter: drop-shadow(0 0 30px rgba(244, 63, 94, 0.85)) drop-shadow(0 0 60px rgba(251, 191, 36, 0.5));
            animation: eternityFloat 3s ease-in-out infinite, popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes eternityFloat {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-10px) scale(1.03); }
        }

        .clear-ment {
            font-family: 'Jua', sans-serif;
            font-size: 2.6rem;
            background: linear-gradient(90deg, #fda4af, #ffffff, #fde047);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            filter: drop-shadow(0 0 15px rgba(244, 63, 94, 0.8));
            margin-bottom: 1.8rem;
            animation: popIn 0.7s ease-out;
        }

        .clear-home-btn {
            font-family: 'Jua', sans-serif;
            font-size: 1.35rem;
            color: #ffffff;
            background: linear-gradient(135deg, #f43f5e 0%, #db2777 50%, #9333ea 100%);
            border: 2px solid #fecdd3;
            padding: 15px 48px;
            border-radius: 999px;
            cursor: pointer;
            box-shadow: 0 0 28px rgba(244, 63, 94, 0.7), 0 6px 20px rgba(0, 0, 0, 0.7);
            transition: all 0.25s ease;
            animation: popIn 0.8s ease-out;
        }

        .clear-home-btn:hover {
            transform: translateY(-3px) scale(1.06);
            border-color: #ffffff;
            box-shadow: 0 0 40px rgba(251, 113, 133, 0.95), 0 0 20px rgba(253, 224, 71, 0.6);
        }

        .clear-home-btn:active {
            transform: translateY(1px) scale(0.98);
        }

        @media (max-width: 768px) {
            .main-content {
                top: auto;
                bottom: 8%;
                left: 50%;
                right: auto;
                transform: translateX(-50%);
            }
            .top-hud {
                flex-direction: column;
                gap: 6px;
            }
            .status-text {
                font-size: 1.35rem;
                padding: 8px 18px;
            }
            .stage {
                height: 360px;
            }
            .cup-slot {
                width: 90px;
                height: 140px;
                margin-left: -45px;
                margin-top: -70px;
            }
            .pigeon-box {
                width: 78px;
                height: 78px;
            }
            .magic-hat {
                transform: translateY(-75px) scale(0.62);
            }
            .cup-slot.covered .magic-hat {
                transform: translateY(0) scale(0.62);
            }
            .stage.compact .magic-hat {
                transform: translateY(-70px) scale(0.55);
            }
            .stage.compact .cup-slot.covered .magic-hat {
                transform: translateY(0) scale(0.55);
            }
            .fail-ment, .clear-ment {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="overlay"></div>
    <div class="bg-sparkles"></div>

    <!-- 1. 시작 전 타이틀 화면 -->
    <main id="titleScreen" class="main-content">
        <p class="sub-top">✦ 환상의 비둘기 마술 ✦</p>
        <h1 class="title">고던의<br>비둘기 야바위</h1>
        <p class="sub-bottom">모자 속에 숨은 비둘기를 지켜보세요.</p>
        <button class="btn-primary" onclick="startGame()">시작하기</button>
    </main>

    <!-- 2. 야바위 게임 진행 화면 -->
    <section id="gameScreen" class="game-screen">
        <div class="top-hud">
            <p id="stageBadge" class="stage-badge">STAGE 1 • 모자 3개</p>
            <div class="lives-box" title="남은 목숨">
                <span class="heart" id="heart-1">❤️</span>
                <span class="heart" id="heart-2">❤️</span>
                <span class="heart" id="heart-3">❤️</span>
            </div>
        </div>
        <h2 id="statusText" class="status-text">비둘기의 위치를 맞추세요!</h2>

        <div class="stage" id="stage"></div>

        <div class="action-area">
            <button id="nextBtn" class="btn-primary next-btn" onclick="goNextStage()">다음으로 넘어가셈</button>
        </div>
    </section>

    <!-- 3. 실패 시 등장하는 경고창 -->
    <div id="failModal" class="fail-modal">
        <img id="failImg" src="근육남.jpg" alt="경고 이미지" class="fail-img">
        <p id="failMent" class="fail-ment">"다시 신중하게 보라고 boy~"</p>
        <p id="failTimer" class="fail-timer">3초 뒤에 다시 시작합니다...</p>
        <button id="restartHomeBtn" class="restart-home-btn" onclick="resetToHome()">게임 처음부터 다시 하기</button>
    </div>

    <!-- 4. 전체 클리어 시 등장하는 이터니티 축하창 -->
    <div id="clearModal" class="clear-modal">
        <img src="이터니티.png" alt="이터니티 티어" class="eternity-img">
        <p class="clear-ment">"이번엔 이터니티 갈 수 있을거야 boy~"</p>
        <button class="clear-home-btn" onclick="resetToHome()">처음으로 돌아가기</button>
    </div>

    <script>
        let transparentPigeonUrl = 'pigeon.jpg';

        let currentStage = 1;
        let hatCount = 3;
        let slotPositions = [];
        let answerSlot = 0;
        let canPick = false;

        const MAX_LIVES = 3;
        let lives = MAX_LIVES;
        let failCount = 0;

        const wait = (ms) => new Promise(resolve => setTimeout(resolve, ms));

        // 비둘기 이미지(pigeon.jpg)의 흰색 배경 투명화 처리
        window.addEventListener('DOMContentLoaded', () => {
            const rawImg = new Image();
            rawImg.src = 'pigeon.jpg';

            rawImg.onload = () => {
                try {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = rawImg.width;
                    canvas.height = rawImg.height;
                    ctx.drawImage(rawImg, 0, 0);

                    const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const data = imgData.data;
                    const visited = new Uint8Array(canvas.width * canvas.height);
                    const stack = [
                        [0, 0],
                        [canvas.width - 1, 0],
                        [0, canvas.height - 1],
                        [canvas.width - 1, canvas.height - 1]
                    ];

                    const isWhite = (idx) => data[idx] > 235 && data[idx + 1] > 235 && data[idx + 2] > 235;

                    while (stack.length > 0) {
                        const [x, y] = stack.pop();
                        if (x < 0 || x >= canvas.width || y < 0 || y >= canvas.height) continue;
                        const pos = y * canvas.width + x;
                        if (visited[pos]) continue;
                        visited[pos] = 1;

                        const idx = pos * 4;
                        if (isWhite(idx)) {
                            data[idx + 3] = 0;
                            stack.push([x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]);
                        }
                    }

                    ctx.putImageData(imgData, 0, 0);
                    transparentPigeonUrl = canvas.toDataURL('image/png');

                    document.querySelectorAll('.pigeon-img').forEach(img => {
                        img.src = transparentPigeonUrl;
                        img.style.borderRadius = '0';
                    });
                } catch (e) {
                    // 로컬 직접 실행 시 원본 유지
                }
            };
        });

        function updateHeartsUI() {
            for (let i = 1; i <= MAX_LIVES; i++) {
                const heartEl = document.getElementById(`heart-${i}`);
                if (i <= lives) {
                    heartEl.classList.remove('lost');
                } else {
                    heartEl.classList.add('lost');
                }
            }
        }

        function getCoordinates(count) {
            const isMobile = window.innerWidth <= 768;

            if (count === 3) {
                const xGap = isMobile ? 110 : 225;
                return [
                    { x: -xGap, y: 20 },
                    { x: 0,     y: 20 },
                    { x: xGap,  y: 20 }
                ];
            } else if (count === 6) {
                const xGap = isMobile ? 110 : 225;
                const yGap = isMobile ? 95 : 115;
                return [
                    { x: -xGap, y: -yGap + 25 },
                    { x: 0,     y: -yGap + 25 },
                    { x: xGap,  y: -yGap + 25 },
                    { x: -xGap, y: yGap + 25 },
                    { x: 0,     y: yGap + 25 },
                    { x: xGap,  y: yGap + 25 }
                ];
            } else {
                const xGap = isMobile ? 68 : 175;
                const yGap = isMobile ? 92 : 115;
                const coords = [];
                for (let row = 0; row < 2; row++) {
                    const y = (row === 0 ? -yGap : yGap) + 25;
                    for (let col = -2; col <= 2; col++) {
                        coords.push({ x: col * xGap, y });
                    }
                }
                return coords;
            }
        }

        function buildStageSlots(count) {
            const stageEl = document.getElementById('stage');
            stageEl.innerHTML = '';

            if (count === 10) {
                stageEl.classList.add('compact');
            } else {
                stageEl.classList.remove('compact');
            }

            for (let i = 0; i < count; i++) {
                const slot = document.createElement('div');
                slot.className = 'cup-slot';
                slot.id = `slot-${i}`;
                slot.onclick = () => selectSlot(i);

                slot.innerHTML = `
                    <div class="magic-hat">
                        <div class="hat-crown">
                            <span class="hat-emblem">♥</span>
                            <div class="hat-ribbon"></div>
                        </div>
                        <div class="hat-brim"></div>
                    </div>
                    <div class="pigeon-box" id="pigeon-${i}">
                        <img class="pigeon-img" src="${transparentPigeonUrl}" alt="비둘기" style="${transparentPigeonUrl !== 'pigeon.jpg' ? 'border-radius:0;' : ''}">
                    </div>
                `;
                stageEl.appendChild(slot);
            }
        }

        function renderPositions(arcSlotA = -1, arcSlotB = -1) {
            const coords = getCoordinates(hatCount);
            for (let i = 0; i < hatCount; i++) {
                const slotEl = document.getElementById(`slot-${i}`);
                if (!slotEl) continue;

                const pos = coords[slotPositions[i]];
                let arcY = 0;
                if (i === arcSlotA) arcY = -24;
                if (i === arcSlotB) arcY = 20;

                slotEl.style.zIndex = (i === arcSlotA) ? 15 : (slotPositions[i] + 1);
                slotEl.style.transform = `translate(${pos.x}px, ${pos.y + arcY}px)`;
            }
        }

        function startGame() {
            currentStage = 1;
            hatCount = 3;
            lives = MAX_LIVES;
            failCount = 0;
            updateHeartsUI();

            document.body.classList.add('game-active');
            document.getElementById('titleScreen').classList.add('hidden');
            document.getElementById('gameScreen').classList.add('active');
            initRound();
        }

        // 타이틀 화면으로 완전히 초기화하여 복귀
        function resetToHome() {
            const failModal = document.getElementById('failModal');
            const clearModal = document.getElementById('clearModal');

            failModal.classList.remove('show', 'game-over', 'meteor-mode');
            clearModal.classList.remove('show');
            document.getElementById('restartHomeBtn').classList.remove('show');

            currentStage = 1;
            hatCount = 3;
            lives = MAX_LIVES;
            failCount = 0;
            updateHeartsUI();

            document.body.classList.remove('game-active');
            document.getElementById('gameScreen').classList.remove('active');
            document.getElementById('titleScreen').classList.remove('hidden');
        }

        async function initRound() {
            canPick = false;
            const stageEl = document.getElementById('stage');
            const badgeEl = document.getElementById('stageBadge');
            stageEl.classList.remove('fast-mode');
            badgeEl.classList.remove('hell-mode');

            if (currentStage === 1) {
                hatCount = 3;
                badgeEl.textContent = "STAGE 1 • 모자 3개";
            } else if (currentStage === 2) {
                hatCount = 6;
                badgeEl.textContent = "STAGE 2 • 모자 6개";
            } else {
                hatCount = 10;
                badgeEl.textContent = "FINAL STAGE • 모자 10개 (3배속!)";
                badgeEl.classList.add('hell-mode');
            }

            buildStageSlots(hatCount);

            slotPositions = Array.from({ length: hatCount }, (_, idx) => idx);
            renderPositions();

            const statusText = document.getElementById('statusText');
            const nextBtn = document.getElementById('nextBtn');

            nextBtn.classList.remove('show');
            answerSlot = Math.floor(Math.random() * hatCount);

            statusText.textContent = "비둘기의 위치를 맞추세요! 잘 기억하세요...";
            await wait(400);

            for (let i = 0; i < hatCount; i++) {
                document.getElementById(`pigeon-${i}`).classList.add('visible');
            }
            await wait(900);

            statusText.textContent = "이 비둘기를 끝까지 따라가세요!";
            for (let i = 0; i < hatCount; i++) {
                if (i !== answerSlot) {
                    document.getElementById(`pigeon-${i}`).classList.remove('visible');
                }
            }
            await wait(1100);

            for (let i = 0; i < hatCount; i++) {
                document.getElementById(`slot-${i}`).classList.add('covered');
            }
            await wait(550);

            document.getElementById(`pigeon-${answerSlot}`).classList.remove('visible');
            statusText.textContent = (currentStage === 3)
                ? "⚡ 초고속(3배속)으로 섞는 중!! 눈 크게 뜨세요!"
                : "비둘기 위치를 섞는 중...";
            await wait(300);

            const shuffleCount = (currentStage === 1) ? 8 : (currentStage === 2 ? 11 : 18);
            const speed = (currentStage === 3) ? 113 : 340;

            if (currentStage === 3) {
                stageEl.classList.add('fast-mode');
            }

            for (let step = 0; step < shuffleCount; step++) {
                let a = Math.floor(Math.random() * hatCount);
                let b = Math.floor(Math.random() * hatCount);
                while (a === b) {
                    b = Math.floor(Math.random() * hatCount);
                }

                const temp = slotPositions[a];
                slotPositions[a] = slotPositions[b];
                slotPositions[b] = temp;

                renderPositions(a, b);
                await wait(speed * 0.55);
                renderPositions(-1, -1);
                await wait(speed * 0.45);
            }

            stageEl.classList.remove('fast-mode');
            statusText.textContent = "비둘기가 숨은 모자를 클릭하세요!";
            for (let i = 0; i < hatCount; i++) {
                document.getElementById(`slot-${i}`).classList.add('clickable');
            }
            canPick = true;
        }

        async function selectSlot(pickedSlot) {
            if (!canPick) return;
            canPick = false;

            const statusText = document.getElementById('statusText');
            const nextBtn = document.getElementById('nextBtn');

            for (let i = 0; i < hatCount; i++) {
                const slot = document.getElementById(`slot-${i}`);
                slot.classList.remove('clickable', 'covered');
            }

            document.getElementById(`pigeon-${answerSlot}`).classList.add('visible');

            if (pickedSlot === answerSlot) {
                if (currentStage === 1) {
                    await wait(300);
                    statusText.textContent = "🎉 정답! 다음은 모자 6개에 도전하세요!";
                    nextBtn.textContent = "다음으로 넘어가셈";
                    nextBtn.classList.add('show');
                } else if (currentStage === 2) {
                    await wait(300);
                    statusText.textContent = "🔥 대단합니다! 마지막은 모자 10개 + 3배속!";
                    nextBtn.textContent = "다음으로 넘어가셈";
                    nextBtn.classList.add('show');
                } else {
                    // 3단계(전체 클리어) 달성 시 이터니티 축하 모달 오픈!
                    statusText.textContent = "👑 정답입니다! 모든 스테이지 클리어!";
                    await wait(650);
                    document.getElementById('clearModal').classList.add('show');
                }
            } else {
                lives--;
                failCount++;
                updateHeartsUI();

                await wait(650);
                handleFailure();
            }
        }

        function triggerImgShake(imgEl) {
            imgEl.style.animation = 'none';
            imgEl.offsetHeight;
            imgEl.style.animation = '';
        }

        async function handleFailure() {
            const failModal = document.getElementById('failModal');
            const failImg = document.getElementById('failImg');
            const failMent = document.getElementById('failMent');
            const failTimer = document.getElementById('failTimer');
            const restartHomeBtn = document.getElementById('restartHomeBtn');

            failModal.classList.remove('game-over', 'meteor-mode');
            triggerImgShake(failImg);

            if (failCount === 1) {
                failImg.src = '근육남.jpg';
                failMent.textContent = '"다시 신중하게 보라고 boy~"';
                failTimer.style.display = 'inline-block';
                restartHomeBtn.classList.remove('show');
                failModal.classList.add('show');

                for (let sec = 3; sec >= 1; sec--) {
                    failTimer.textContent = `${sec}초 뒤에 다시 시작합니다... (남은 목숨 ${lives}개)`;
                    await wait(1000);
                }

                failModal.classList.remove('show');
                initRound();

            } else if (failCount === 2) {
                failImg.src = '근육남2.jpg';
                failMent.textContent = '"집중하라고 했지 boy~"';
                failTimer.style.display = 'inline-block';
                failTimer.textContent = `3초 뒤에 다시 시작합니다... (마지막 목숨 ${lives}개!)`;
                restartHomeBtn.classList.remove('show');
                failModal.classList.add('show');

                await wait(1000);

                failModal.classList.add('meteor-mode');
                failImg.src = '고던 메테오4.png';
                failMent.textContent = '"그러니까 메테오4 인거 아니야?"';
                triggerImgShake(failImg);

                for (let sec = 2; sec >= 1; sec--) {
                    failTimer.textContent = `${sec}초 뒤에 다시 시작합니다... (마지막 목숨 ${lives}개!)`;
                    await wait(1000);
                }

                failModal.classList.remove('show', 'meteor-mode');
                initRound();

            } else {
                failModal.classList.add('game-over');
                failImg.src = '근육남 3.jpg';
                failMent.textContent = '"너 때문에 표독해졌어 boy~"';
                failTimer.style.display = 'none';
                restartHomeBtn.classList.add('show');
                failModal.classList.add('show');
            }
        }

        function goNextStage() {
            if (currentStage < 3) {
                currentStage++;
                initRound();
            } else {
                resetToHome();
            }
        }

        window.addEventListener('resize', () => renderPositions());
    </script>
</body>
</html>
